# Needed for display and LVGL (prevent stack overflow and crash) 
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Enable display driver
CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_MIPI_DBI=y

# Enable LVGL widgets
CONFIG_LVGL=y
CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_20=y

# monochrome
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y

# DPI (416 px / 4.16 in ?)
CONFIG_LV_DPI_DEF=100

# use custom malloc/free
CONFIG_LV_MEM_CUSTOM=y

# heap space required (app dependent)
# CONFIG_LV_Z_MEM_POOL_NUMBER_BLOCKS=8

CONFIG_LV_Z_MEM_POOL_SIZE=8192
# Keep tiled flushing: Zephyr's LVGL EPD adapter uses the first/last tiles to
# bracket a frame with display_blanking_on/off().
CONFIG_LV_Z_VDB_SIZE=100

# Enable logging for debugging purposes
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
