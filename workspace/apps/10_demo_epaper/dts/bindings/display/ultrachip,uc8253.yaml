description: |
  UltraChip UC8253 EPD display controller as used by the Good Display
  GDEY037T03 240x416 monochrome panel.

  The binding follows the structure of Zephyr's ultrachip,uc81xx-common
  binding. This driver currently supports full updates only, so refresh
  profile child nodes are not exposed yet.

compatible: "ultrachip,uc8253"

include: [mipi-dbi-spi-device.yaml, display-controller.yaml]

properties:
  busy-gpios:
    type: phandle-array
    required: true
    description: |
      BUSY pin. The UC8253 BUSY signal is active low, so a directly
      connected MCU pin should use GPIO_ACTIVE_LOW.

  psr:
    type: uint8-array
    default: [0x1F, 0x0D]
    description: |
      Two-byte Panel Setting Register value. The default matches the
      GDEY037T03 panel's OTP waveform configuration in GxEPD2.
